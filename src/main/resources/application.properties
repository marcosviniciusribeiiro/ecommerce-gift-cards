spring.application.name=Ecommerce
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db
spring.datasource.username=root

//importação(senha-root e senha-jwt)
spring.config.import=optional:classpath:application-local.properties
//spring.datasource.password=SUA-SENHA
//jwt.secret=SUA-CHAVE-SECRETA

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Asaas Sandbox
asaas.api.url=https://api-sandbox.asaas.com/v3
asaas.api.key=${ASAAS_API_KEY}
asaas.sandbox.customer-id=${ASAAS_TEST_CUSTOMER_ID}

# Autenticação dos webhooks Asaas
asaas.webhook.token=${ASAAS_WEBHOOK_TOKEN}

# Processamento automatico dos webhooks
webhook.processamento.habilitado=true
webhook.processamento.intervalo-ms=60000