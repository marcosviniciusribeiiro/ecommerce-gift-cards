<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido | Gift Cards</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
<header>
    <h1>Pedido | Gift Cards</h1>
    <nav>
        <a href="/index.html">Lista de Produtos</a>
        <a href="/perfil.html">Perfil</a>
        <a href="/meus-pedidos.html">Meus Pedidos</a>
    </nav>
</header>
<main>
    <section class="detalhes">
        <h2 id="pedido"></h2>
        <p>
            <strong>Produto:</strong>
            <span id="produto"></span>
        </p>

        <p>
            <strong>Status:</strong>
            <span id="status"></span>
        </p>

        <p>
            <strong>Data do Pedido:</strong>
            <span id="data"></span>
        </p>

        <p>
            <strong>Valor Total:</strong>
            <span id="valor"></span>
        </p>

        <button id="cancelarButton">Cancelar Pedido</button>
        <button id="codigoButton">Visualizar Código</button>

        <p>
            <strong id="codigoSpan" style="display: none">Código:</strong>
            <span id="codigoGiftCard"></span>
        </p>

        <p id="mensagemPedido" class="mensagem"></p>
    </section>
</main>
<script src="/js/utils/mensagens.js"></script>
<script src="/js/utils/formatadores.js"></script>
<script src="/js/utils/autenticacao.js"></script>
<script src="/js/pedido.js"></script>
</body>
</html>
