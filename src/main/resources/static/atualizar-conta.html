<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Dados | Usuário</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
<main>
    <h1>Atualizar Dados | Usuário</h1>
    <form id="atualizarForm">
        <div>
            <p>
                <label for="nome">
                    <strong>Nome:</strong>
                </label>
                <input type="text" id="nome" name="nome" maxlength="255" required>
            </p>

            <p>
                <label for="email">
                    <strong>Email:</strong>
                </label>
                <input type="email" id="email" name="email" maxlength="255" required>
            </p>

            <p>
                <label for="senha">
                    <strong>Senha:</strong>
                </label>
                <input type="password" id="senha" name="senha" maxlength="32" required>
            </p>

            <button type="submit">Atualizar</button>

            <p id="mensagemAtualizar" class="mensagem"></p>
        </div>
    </form>
</main>
<script src="/js/utils/mensagens.js"></script>
<script src="/js/atualizar-conta.js"></script>
</body>
</html>
